<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today — To-do list</title>
<meta name="description" content="A calm, fast to-do list with priorities, due dates, search and drag-to-reorder.">
<style>
  :root {
    --bg: #e8edf3;
    --bg-accent: #d9e2ee;
    --sheet: #ffffff;
    --sheet-2: #f5f7fb;
    --ink: #17233b;
    --ink-2: #53607a;
    --ink-3: #8993a8;
    --line: #e3e8f0;
    --brand: #3150d6;
    --brand-ink: #ffffff;
    --brand-soft: #e7ecff;
    --high: #d93f4c;
    --med: #e59a1f;
    --low: #2f9e74;
    --danger-soft: #fdebed;
    --shadow: 0 1px 2px rgba(23,35,59,.06), 0 12px 40px -12px rgba(23,35,59,.22);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0f1626;
    --bg-accent: #16203a;
    --sheet: #18213a;
    --sheet-2: #1e2946;
    --ink: #e9eefb;
    --ink-2: #a8b3cc;
    --ink-3: #6f7b97;
    --line: #28345a;
    --brand: #7b93ff;
    --brand-ink: #0f1626;
    --brand-soft: #25315c;
    --high: #ff6b78;
    --med: #f4b04a;
    --low: #4fc79b;
    --danger-soft: #3a2230;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 20px 50px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    background:
      radial-gradient(900px 500px at 85% -10%, var(--bg-accent), transparent 70%),
      var(--bg);
    padding: clamp(16px, 5vw, 56px) 16px 64px;
    transition: background-color .25s ease, color .25s ease;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .app {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    background: var(--sheet);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background-color .25s ease;
  }

  /* ---------- Header ---------- */
  .head { padding: 32px 32px 24px; }
  .head-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .weekday {
    margin: 0;
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(2.2rem, 7vw, 3.1rem);
    line-height: 1.05;
    letter-spacing: -.02em;
  }
  .date {
    margin: 6px 0 0;
    color: var(--ink-2);
    font-size: 1rem;
  }
  .icon-btn {
    flex: none;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--sheet-2);
    color: var(--ink-2);
    transition: background-color .15s, color .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--ink); border-color: var(--ink-3); }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-moon { display: none; }
  [data-theme="dark"] .icon-sun { display: none; }
  [data-theme="dark"] .icon-moon { display: block; }

  .progress { margin-top: 24px; }
  .progress-row { display: flex; justify-content: space-between; align-items: baseline; font-size: .9rem; color: var(--ink-2); margin-bottom: 8px; }
  .progress-row strong { color: var(--ink); font-weight: 650; }
  .track { height: 8px; border-radius: 99px; background: var(--sheet-2); overflow: hidden; border: 1px solid var(--line); }
  .fill { height: 100%; width: 0; background: var(--brand); border-radius: 99px; transition: width .45s cubic-bezier(.3,.8,.3,1); }

  /* ---------- Add form ---------- */
  .add {
    padding: 0 32px 24px;
    display: grid;
    gap: 10px;
  }
  .add-main { display: flex; gap: 10px; }
  .field {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--sheet-2);
    transition: border-color .15s, box-shadow .15s, background-color .15s;
  }
  .field::placeholder { color: var(--ink-3); }
  .field:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: var(--sheet); }
  .btn-primary {
    flex: none;
    height: 48px;
    padding: 0 22px;
    border: 0;
    border-radius: 12px;
    background: var(--brand);
    color: var(--brand-ink);
    font-weight: 650;
    transition: transform .1s, filter .15s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(.97); }
  .add-opts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .opt {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--sheet-2);
    font-size: .875rem;
    color: var(--ink-2);
  }
  .opt select, .opt input {
    border: 0; background: transparent; outline: none; padding: 0; height: 100%;
    color: var(--ink); font-size: .875rem;
  }
  .opt select { cursor: pointer; }
  .opt:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .opt .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--med); }
  .opt[data-p="high"] .dot { background: var(--high); }
  .opt[data-p="low"] .dot { background: var(--low); }
  .opt[data-p="none"] .dot { background: var(--ink-3); }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    padding: 14px 32px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: var(--sheet-2);
  }
  .seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--line); gap: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--ink-2);
    padding: 6px 14px; border-radius: 8px; font-size: .875rem; font-weight: 550;
    transition: background-color .15s, color .15s;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(23,35,59,.15); }
  .seg .count { margin-left: 6px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .search {
    position: relative;
    flex: 1 1 160px; max-width: 240px;
  }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-3); pointer-events: none; }
  .search input {
    width: 100%; height: 36px; padding: 0 12px 0 34px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--sheet);
    font-size: .875rem;
  }
  .search input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }

  /* ---------- List ---------- */
  .list { list-style: none; margin: 0; padding: 8px 16px; min-height: 120px; }
  .task {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px 14px 18px;
    border-radius: 14px;
    transition: background-color .15s, opacity .2s;
  }
  .task + .task::before {
    content: ""; position: absolute; top: 0; left: 18px; right: 16px; height: 1px; background: var(--line);
  }
  .task:hover { background: var(--sheet-2); }
  .task:hover::before, .task:hover + .task::before { opacity: 0; }
  .task::after {
    content: ""; position: absolute; left: 4px; top: 14px; bottom: 14px; width: 4px; border-radius: 4px;
    background: transparent;
  }
  .task[data-p="high"]::after { background: var(--high); }
  .task[data-p="med"]::after { background: var(--med); }
  .task[data-p="low"]::after { background: var(--low); }
  .task.dragging { opacity: .4; background: var(--brand-soft); }
  .task.enter { animation: pop .28s cubic-bezier(.3,.8,.3,1); }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }

  .check { position: relative; flex: none; width: 24px; height: 24px; }
  .check input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
  .check .box {
    position: absolute; inset: 0; border-radius: 8px;
    border: 2px solid var(--ink-3);
    display: grid; place-items: center;
    transition: background-color .15s, border-color .15s, transform .15s;
  }
  .check .box svg { width: 14px; height: 14px; stroke: var(--brand-ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .25s ease .05s; }
  .check input:hover + .box { border-color: var(--brand); }
  .check input:focus-visible + .box { outline: 2px solid var(--brand); outline-offset: 3px; }
  .check input:checked + .box { background: var(--brand); border-color: var(--brand); }
  .check input:checked + .box svg { stroke-dashoffset: 0; }
  .check input:active + .box { transform: scale(.88); }

  .body { flex: 1; min-width: 0; }
  .text {
    display: block; word-break: break-word;
    font-size: 1.02rem; font-weight: 500;
    transition: color .2s;
  }
  .task.done .text { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-size: .8rem; color: var(--ink-2); }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 8px; border-radius: 99px;
    background: var(--sheet-2); border: 1px solid var(--line);
  }
  .chip svg { width: 12px; height: 12px; }
  .chip.overdue { background: var(--danger-soft); border-color: transparent; color: var(--high); font-weight: 600; }
  .chip.today { background: var(--brand-soft); border-color: transparent; color: var(--brand); font-weight: 600; }
  .task.done .chip { opacity: .6; }

  .edit-input {
    width: 100%; height: 36px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--brand); background: var(--sheet); box-shadow: 0 0 0 3px var(--brand-soft);
    font-size: 1.02rem; font-weight: 500; outline: none;
  }

  .actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .task:hover .actions, .task:focus-within .actions { opacity: 1; }
  @media (hover: none) { .actions { opacity: 1; } }
  .mini {
    width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px;
    display: grid; place-items: center; color: var(--ink-3);
    transition: background-color .15s, color .15s;
  }
  .mini svg { width: 17px; height: 17px; }
  .mini:hover { background: var(--line); color: var(--ink); }
  .mini.del:hover { background: var(--danger-soft); color: var(--high); }
  .grip { cursor: grab; }
  .grip:active { cursor: grabbing; }

  /* ---------- Empty ---------- */
  .empty { text-align: center; padding: 40px 24px 36px; color: var(--ink-2); }
  .empty svg { width: 64px; height: 64px; color: var(--ink-3); margin-bottom: 8px; }
  .empty h2 { margin: 0 0 4px; font-family: var(--serif); font-size: 1.35rem; color: var(--ink); font-weight: 600; }
  .empty p { margin: 0; max-width: 34ch; margin-inline: auto; }

  /* ---------- Footer ---------- */
  .foot {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 32px 20px;
    border-top: 1px solid var(--line);
    font-size: .875rem; color: var(--ink-2);
  }
  .link-btn { border: 0; background: none; color: var(--ink-2); padding: 6px 10px; border-radius: 8px; font-size: .875rem; font-weight: 550; }
  .link-btn:hover:not(:disabled) { color: var(--high); background: var(--danger-soft); }
  .link-btn:disabled { opacity: .4; cursor: default; }
  .hint { color: var(--ink-3); font-size: .8rem; text-align: center; margin: 18px 0 0; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translate(-50%, 24px);
    display: flex; align-items: center; gap: 14px;
    padding: 10px 10px 10px 18px;
    border-radius: 14px;
    background: var(--ink); color: var(--sheet);
    box-shadow: 0 12px 30px -8px rgba(0,0,0,.4);
    font-size: .9rem;
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .25s cubic-bezier(.3,.8,.3,1);
    z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { border: 0; background: rgba(255,255,255,.16); color: inherit; padding: 6px 12px; border-radius: 9px; font-weight: 600; }
  [data-theme="dark"] .toast button { background: rgba(0,0,0,.14); }
  .toast button:hover { background: rgba(255,255,255,.26); }

  @media (max-width: 520px) {
    .head { padding: 24px 20px 20px; }
    .add { padding: 0 20px 20px; }
    .toolbar { padding: 12px 20px; }
    .search { max-width: none; flex-basis: 100%; order: 2; }
    .foot { padding: 12px 20px 18px; }
    .list { padding: 6px 8px; }
    .task { gap: 12px; padding-right: 8px; }
    .mini.grip { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main class="app" aria-labelledby="weekday">
  <header class="head">
    <div class="head-top">
      <div>
        <h1 class="weekday" id="weekday">Today</h1>
        <p class="date" id="date"></p>
      </div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
    <div class="progress" aria-live="polite">
      <div class="progress-row">
        <span id="progressText"></span>
        <strong id="progressPct">0%</strong>
      </div>
      <div class="track" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track">
        <div class="fill" id="fill"></div>
      </div>
    </div>
  </header>

  <form class="add" id="addForm" autocomplete="off">
    <div class="add-main">
      <label class="sr-only" for="newText">New task</label>
      <input class="field" id="newText" type="text" placeholder="What needs doing?" maxlength="200" required>
      <button class="btn-primary" type="submit">Add task</button>
    </div>
    <div class="add-opts">
      <label class="opt" id="prioWrap" data-p="med">
        <span class="dot" aria-hidden="true"></span>
        <span class="sr-only">Priority</span>
        <select id="newPrio">
          <option value="none">No priority</option>
          <option value="low">Low priority</option>
          <option value="med" selected>Medium priority</option>
          <option value="high">High priority</option>
        </select>
      </label>
      <label class="opt">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span>Due</span>
        <input id="newDue" type="date">
      </label>
    </div>
  </form>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Filter tasks" id="filters">
      <button type="button" data-filter="all" aria-pressed="true">All<span class="count" id="cAll">0</span></button>
      <button type="button" data-filter="active" aria-pressed="false">To do<span class="count" id="cActive">0</span></button>
      <button type="button" data-filter="done" aria-pressed="false">Done<span class="count" id="cDone">0</span></button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr-only" for="search">Search tasks</label>
      <input id="search" type="search" placeholder="Search tasks">
    </div>
  </div>

  <ul class="list" id="list" aria-label="Tasks"></ul>

  <footer class="foot">
    <span id="leftText"></span>
    <button class="link-btn" id="clearDone" type="button">Clear completed</button>
  </footer>
</main>

<p class="hint">Double-click a task to edit it. Drag the handle to reorder.</p>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo">Undo</button>
</div>

<script>
(() => {
  'use strict';

  /* ---------- Storage (falls back to memory if unavailable) ---------- */
  const KEY = 'todo-app:v1';
  const store = {
    mem: {},
    get(k) { try { return localStorage.getItem(k); } catch (e) { return this.mem[k] ?? null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { this.mem[k] = v; } }
  };

  /* ---------- State ---------- */
  let tasks = [];
  let filter = 'all';
  let query = '';
  let lastRemoved = null;
  let toastTimer = null;

  try {
    const saved = JSON.parse(store.get(KEY));
    if (Array.isArray(saved)) tasks = saved;
  } catch (e) {}

  if (!tasks.length && store.get(KEY) === null) {
    const d = (n) => { const x = new Date(); x.setDate(x.getDate() + n); return toISO(x); };
    tasks = [
      mk('Review this week’s priorities', 'high', d(0), false),
      mk('Reply to the design feedback', 'med', d(1), false),
      mk('Book a dentist appointment', 'low', '', false),
      mk('Plan the weekend trip', 'none', d(3), true),
    ];
    save();
  }

  /* ---------- Helpers ---------- */
  const $ = (id) => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function mk(text, priority, due, done) { return { id: uid(), text, priority, due: due || '', done: !!done }; }
  function toISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function save() { store.set(KEY, JSON.stringify(tasks)); }
  function todayISO() { return toISO(new Date()); }

  function dueInfo(iso) {
    if (!iso) return null;
    const [y, m, d] = iso.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const diff = Math.round((date - t) / 86400000);
    if (diff < 0) return { label: diff === -1 ? 'Yesterday' : 'Overdue · ' + fmt(date), cls: 'overdue' };
    if (diff === 0) return { label: 'Today', cls: 'today' };
    if (diff === 1) return { label: 'Tomorrow', cls: '' };
    return { label: fmt(date), cls: '' };
  }
  function fmt(date) {
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: date.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  }

  const PRIO_LABEL = { high: 'High', med: 'Medium', low: 'Low' };

  const svg = {
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>',
    grip: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3v18h2v-7h11l-2-4 2-4H7V3z"/></svg>',
  };

  /* ---------- Header ---------- */
  function renderDate() {
    const now = new Date();
    $('weekday').textContent = now.toLocaleDateString(undefined, { weekday: 'long' });
    $('date').textContent = now.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
  }

  /* ---------- Render ---------- */
  function visible() {
    const q = query.trim().toLowerCase();
    return tasks.filter(t =>
      (filter === 'all' || (filter === 'active' ? !t.done : t.done)) &&
      (!q || t.text.toLowerCase().includes(q))
    );
  }

  function render(enterId) {
    const list = $('list');
    list.textContent = '';
    const items = visible();

    items.forEach(t => list.appendChild(taskEl(t, t.id === enterId)));
    if (!items.length) list.appendChild(emptyEl());

    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const active = total - done;
    const pct = total ? Math.round(done / total * 100) : 0;

    $('cAll').textContent = total;
    $('cActive').textContent = active;
    $('cDone').textContent = done;
    $('fill').style.width = pct + '%';
    $('progressPct').textContent = pct + '%';
    $('track').setAttribute('aria-valuenow', pct);
    $('progressText').textContent = total
      ? (done === total ? 'Everything is done' : done + ' of ' + total + ' tasks done')
      : 'No tasks yet';
    $('leftText').textContent = active === 1 ? '1 task left' : active + ' tasks left';
    $('clearDone').disabled = done === 0;
  }

  function taskEl(t, entering) {
    const li = document.createElement('li');
    li.className = 'task' + (t.done ? ' done' : '') + (entering ? ' enter' : '');
    li.dataset.id = t.id;
    li.dataset.p = t.priority;

    const check = document.createElement('label');
    check.className = 'check';
    check.innerHTML = '<input type="checkbox"><span class="box">' + svg.check + '</span>';
    const cb = check.querySelector('input');
    cb.checked = t.done;
    cb.setAttribute('aria-label', 'Mark “' + t.text + '” as ' + (t.done ? 'not done' : 'done'));
    cb.addEventListener('change', () => toggle(t.id));

    const body = document.createElement('div');
    body.className = 'body';
    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = t.text;
    text.addEventListener('dblclick', () => startEdit(t.id));
    body.appendChild(text);

    const due = dueInfo(t.due);
    if (due || PRIO_LABEL[t.priority]) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      if (due) {
        const c = document.createElement('span');
        c.className = 'chip ' + (t.done ? '' : due.cls);
        c.innerHTML = svg.cal;
        c.append(due.label);
        meta.appendChild(c);
      }
      if (PRIO_LABEL[t.priority]) {
        const c = document.createElement('span');
        c.className = 'chip';
        c.innerHTML = svg.flag;
        c.firstChild.style.color = 'var(--' + t.priority + ')';
        c.append(PRIO_LABEL[t.priority]);
        meta.appendChild(c);
      }
      body.appendChild(meta);
    }

    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.appendChild(iconBtn('mini grip', svg.grip, 'Drag to reorder', true));
    actions.appendChild(iconBtn('mini', svg.edit, 'Edit task')).addEventListener('click', () => startEdit(t.id));
    actions.appendChild(iconBtn('mini del', svg.trash, 'Delete task')).addEventListener('click', () => remove(t.id));

    const grip = actions.querySelector('.grip');
    grip.addEventListener('mousedown', () => { li.draggable = true; });
    grip.addEventListener('touchstart', () => { li.draggable = true; }, { passive: true });
    li.addEventListener('dragstart', e => {
      li.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', t.id); } catch (_) {}
    });
    li.addEventListener('dragend', () => {
      li.classList.remove('dragging');
      li.draggable = false;
      commitOrder();
    });

    li.append(check, body, actions);
    return li;
  }

  function iconBtn(cls, html, label, isHandle) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = cls;
    b.innerHTML = html;
    b.setAttribute('aria-label', label);
    b.title = label;
    if (isHandle) b.tabIndex = -1;
    return b;
  }

  function emptyEl() {
    const li = document.createElement('li');
    li.className = 'empty';
    let title, msg;
    if (query.trim()) { title = 'No matches'; msg = 'Nothing matches “' + query.trim() + '”. Try a different word.'; }
    else if (!tasks.length) { title = 'A clear day'; msg = 'Add your first task above to get started.'; }
    else if (filter === 'done') { title = 'Nothing finished yet'; msg = 'Tick off a task and it will show up here.'; }
    else if (filter === 'active') { title = 'All caught up'; msg = 'Every task is done. Add another or enjoy the quiet.'; }
    else { title = 'Nothing here'; msg = 'Add a task to begin.'; }
    li.innerHTML = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="10" y="8" width="44" height="48" rx="8"/><path d="M22 24h20M22 34h20M22 44h10"/></svg><h2></h2><p></p>';
    li.querySelector('h2').textContent = title;
    li.querySelector('p').textContent = msg;
    return li;
  }

  /* ---------- Actions ---------- */
  function add(text, priority, due) {
    const t = mk(text.trim(), priority, due, false);
    tasks.unshift(t);
    save();
    if (filter === 'done') setFilter('all'); 
    render(t.id);
  }

  function toggle(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    t.done = !t.done;
    save();
    render();
  }

  function remove(id) {
    const i = tasks.findIndex(x => x.id === id);
    if (i < 0) return;
    lastRemoved = { task: tasks[i], index: i };
    tasks.splice(i, 1);
    save();
    render();
    showToast('Task deleted');
  }

  function startEdit(id) {
    const li = $('list').querySelector('[data-id="' + id + '"]');
    const t = tasks.find(x => x.id === id);
    if (!li || !t) return;
    const textEl = li.querySelector('.text');
    const input = document.createElement('input');
    input.className = 'edit-input';
    input.type = 'text';
    input.maxLength = 200;
    input.value = t.text;
    input.setAttribute('aria-label', 'Edit task');
    textEl.replaceWith(input);
    input.focus();
    input.select();
    let finished = false;
    const finish = (commit) => {
      if (finished) return;
      finished = true;
      const v = input.value.trim();
      if (commit && v && v !== t.text) { t.text = v; save(); }
      render();
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  }

  function clearDone() {
    const removed = tasks.filter(t => t.done);
    if (!removed.length) return;
    lastRemoved = { many: removed, all: tasks.slice() };
    tasks = tasks.filter(t => !t.done);
    save();
    render();
    showToast(removed.length === 1 ? '1 completed task cleared' : removed.length + ' completed tasks cleared');
  }

  function undo() {
    if (!lastRemoved) return;
    if (lastRemoved.many) tasks = lastRemoved.all;
    else tasks.splice(lastRemoved.index, 0, lastRemoved.task);
    lastRemoved = null;
    save();
    render();
    hideToast();
  }

  function setFilter(f) {
    filter = f;
    document.querySelectorAll('#filters button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === f)));
  }

  /* ---------- Drag to reorder ---------- */
  const listEl = $('list');
  listEl.addEventListener('dragover', e => {
    const dragging = listEl.querySelector('.dragging');
    if (!dragging) return;
    e.preventDefault();
    const siblings = [...listEl.querySelectorAll('.task:not(.dragging)')];
    const next = siblings.find(s => e.clientY < s.getBoundingClientRect().top + s.offsetHeight / 2);
    if (next) listEl.insertBefore(dragging, next);
    else listEl.appendChild(dragging);
  });
  listEl.addEventListener('drop', e => e.preventDefault());

  function commitOrder() {
    const ids = [...listEl.querySelectorAll('.task')].map(li => li.dataset.id);
    const shown = new Set(ids);
    const byId = new Map(tasks.map(t => [t.id, t]));
    const reordered = ids.map(id => byId.get(id));
    // Keep hidden (filtered-out) tasks in their original slots
    let k = 0;
    tasks = tasks.map(t => shown.has(t.id) ? reordered[k++] : t);
    save();
    render();
  }

  /* ---------- Toast ---------- */
  function showToast(msg) {
    $('toastMsg').textContent = msg;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast() { $('toast').classList.remove('show'); }

  /* ---------- Theme ---------- */
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    $('themeBtn').setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
  }
  const savedTheme = store.get('todo-app:theme');
  applyTheme(savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    store.set('todo-app:theme', next);
  });

  /* ---------- Events ---------- */
  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = $('newText');
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    add(text, $('newPrio').value, $('newDue').value);
    input.value = '';
    $('newDue').value = '';
    input.focus();
  });

  $('newPrio').addEventListener('change', e => { $('prioWrap').dataset.p = e.target.value; });

  $('filters').addEventListener('click', e => {
    const b = e.target.closest('button[data-filter]');
    if (!b) return;
    setFilter(b.dataset.filter);
    render();
  });

  $('search').addEventListener('input', e => { query = e.target.value; render(); });
  $('clearDone').addEventListener('click', clearDone);
  $('toastUndo').addEventListener('click', undo);

  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      $('newText').focus();
    }
  });
  $('newText').placeholder = 'What needs doing? (press / to focus)';

  /* ---------- Init ---------- */
  renderDate();
  render();
  // Refresh the date header and due labels if the tab stays open past midnight
  setInterval(() => { renderDate(); render(); }, 10 * 60 * 1000);
})();
</script>
</body>
</html>
